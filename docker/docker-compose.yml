# WorkBuddy 每日助手 —— compose 定义
#
# 用法（在飞牛 SSH 里，本文件所在目录执行）：
#   docker compose up -d
#   docker compose logs -f --tail=50
#
# 注意：飞牛 Web 界面导入 compose 时 build: 不生效，
#       所以先 `docker build -t wb-daily:latest .` 再 up。
services:
  workbuddy:
    image: wb-daily:latest
    container_name: workbuddy
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      WEB_HOST: 0.0.0.0
      WEB_PORT: "8080"
    ports:
      # 宿主 18080 → 容器 8080（192.168.2.12 的 8080 已被占用，实测 18080 空闲）
      # 打开：http://192.168.2.12:18080/
      - "18080:8080"
    volumes:
      # 所有数据/报告/账号都落在这里；换机器时把这个目录拷走即可
      - /vol1/docker/workbuddy/data:/data
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,os,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=4).status==200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
